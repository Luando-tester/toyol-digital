name: Toyol AI Brain — Behavioral Quality Proof + Daily Quest (RM0)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/brain-proof.yml'
permissions:
  contents: read
concurrency:
  group: toyol-ai-brain
  cancel-in-progress: false
jobs:
  real-ai-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout Toyol code (no credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check CPU and memory available
        run: |
          nproc
          free -h
      - name: Download pinned open-source llama.cpp CPU binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toyol-llama"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 150 \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12202/llama-b12202-bin-ubuntu-x64.tar.gz" \
            --output "$RUNNER_TEMP/llama-cpu.tar.gz"
          tar -xzf "$RUNNER_TEMP/llama-cpu.tar.gz" -C "$RUNNER_TEMP/toyol-llama"
          find "$RUNNER_TEMP/toyol-llama" -name llama-server -type f
      - name: Download Qwen official 1.5B coder model (no API key)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 360 \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true" \
            --output "$RUNNER_TEMP/brain.gguf"
          test "$(stat -c%s "$RUNNER_TEMP/brain.gguf")" -gt 700000000
          echo "Model bytes verified (size check only; not a cryptographic signature)."
      - name: Run CPU model and verify its independent patch
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find "$RUNNER_TEMP/toyol-llama" -type f -name llama-server | head -n 1)"
          test -n "$SERVER"
          chmod +x "$SERVER"
          export LD_LIBRARY_PATH="$(dirname "$SERVER"):$RUNNER_TEMP/toyol-llama/lib:${LD_LIBRARY_PATH:-}"
          "$SERVER" --model "$RUNNER_TEMP/brain.gguf" --host 127.0.0.1 --port 8080 --ctx-size 3072 --threads 4 --parallel 1 \
            > "$RUNNER_TEMP/toyol-model.log" 2>&1 &
          MODEL_PID=$!
          trap 'kill "$MODEL_PID" 2>/dev/null || true' EXIT
          READY=0
          for n in $(seq 1 90); do
            if curl --fail --silent "http://127.0.0.1:8080/health" | grep -q '"status":"ok"'; then READY=1; break; fi
            if ! kill -0 "$MODEL_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            tail -n 50 "$RUNNER_TEMP/toyol-model.log" || true
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            node src/brain-smoke.mjs
            echo 'AI validation v0.8: grammar-constrained JSON, grounded edits, hidden behavioral tests, at most two retries.'
            node src/brain-benchmark.mjs
          fi
          node src/brain-quest.mjs
      - name: Preserve model proof, whether succeeded or failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toyol-ai-brain-proof
          path: out/brain/
          retention-days: 7
          if-no-files-found: ignore
