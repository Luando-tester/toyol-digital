name: Toyol Radar (RM0)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/toyol.mjs'
      - 'test/toyol.test.mjs'
      - '.github/workflows/toyol.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: toyol-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Toyol repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Toyol filters
        run: node --test
      - name: Scan public bounty feed
        run: node src/toyol.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
