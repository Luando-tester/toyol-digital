name: Toyol Radar and Stage 2 (RM0)
on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/toyol.mjs'
      - 'src/worker.mjs'
      - 'src/skills.mjs'
      - 'src/status.mjs'
      - 'test/toyol.test.mjs'
      - 'test/worker.test.mjs'
      - 'test/skills.test.mjs'
      - 'test/status.test.mjs'
      - '.github/workflows/toyol.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: toyol-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Toyol repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Toyol Stage 1 and Stage 2 safeguards
        run: node --test
      - name: Scan public bounty feed
        run: node src/toyol.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attempt bounded bounty code fix
        run: node src/worker.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write verified progress to Toyol Quest Board
        run: node src/status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve any prepared patch for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toyol-stage2-solution
          path: out/stage2/
          if-no-files-found: ignore
          retention-days: 7
